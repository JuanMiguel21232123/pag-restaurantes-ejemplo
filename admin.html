<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | La Parrilla del Valle</title>
<meta name="robots" content="noindex, nofollow">

<!-- Favicon -->
<link rel="icon" href="/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Styles/admin.css">
</head>
<body>

<div id="login-view" class="login-view">
  <form id="login-form" class="login-form">
    <h1>Panel administrativo</h1>
    <input type="email" name="email" placeholder="Correo" required>
    <input type="password" name="password" placeholder="Contraseña" required>
    <button type="submit">Entrar</button>
    <p id="login-msg" class="msg error"></p>
  </form>
</div>

<div id="panel-view" class="panel-view" hidden>
  <header class="panel-head">
    <div class="brand">La Parrilla del Valle · admin</div>
    <div class="panel-head-right">
      <span id="admin-name"></span>
      <a href="index.html" target="_blank" rel="noopener noreferrer" class="btn-ghost">Ver sitio ↗</a>
      <button id="logout" class="btn-ghost">Salir</button>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab" data-tab="menu" aria-pressed="true">Menú</button>
    <button class="tab" data-tab="categories" aria-pressed="false">Secciones</button>
    <button class="tab" data-tab="reservations" aria-pressed="false">Reservas</button>
    <button class="tab" data-tab="settings" aria-pressed="false">Configuración</button>
    <button class="tab" data-tab="sales" aria-pressed="false">Ventas y Gastos</button>
  </nav>

  <section id="tab-menu" class="tab-panel">
    <nav class="subtabs">
      <button class="subtab" data-subtab="add" aria-pressed="true">Agregar platillo</button>
      <button class="subtab" data-subtab="list" aria-pressed="false">Ver platillos</button>
    </nav>

    <div id="submenu-add" class="subtab-panel">
      <form id="menu-form" class="stacked-form">
        <input type="hidden" name="id">
        <label>Nombre del platillo
          <input type="text" name="name" placeholder="Ej. Lomo al carbón" maxlength="80" required>
        </label>
        <label>Sección
          <select name="category" required>
            <option value="" disabled selected>Selecciona una sección</option>
          </select>
        </label>
        <label>Precio en COP
          <input type="number" name="price" placeholder="Ej. 17950" step="1" min="0" max="2000000" required>
        </label>
        <label>Descripción <span class="label-optional">(opcional)</span>
          <input type="text" name="description" placeholder="Breve descripción del platillo" maxlength="200">
        </label>
        <input type="hidden" name="image_url">
        <label>Foto del platillo
          <input type="file" id="menu-image-input" accept="image/*">
        </label>
        <img id="menu-image-preview" class="menu-image-preview" hidden>
        <div class="stacked-form-actions">
          <button type="submit" class="btn-primary">Guardar platillo</button>
          <button type="button" id="menu-cancel" class="btn-ghost" hidden>Cancelar edición</button>
        </div>
        <p id="menu-msg" class="msg"></p>
      </form>
    </div>

    <div id="submenu-list" class="subtab-panel" hidden>
      <div id="menu-table-container"></div>
    </div>
  </section>

  <section id="tab-categories" class="tab-panel" hidden>
    <form id="category-form" class="inline-form">
      <input type="hidden" name="id">
      <input type="text" name="name" placeholder="Nombre de la sección (ej. Fuertes)" maxlength="40" required>
      <input type="number" name="sort_order" placeholder="Orden (ej. 1)" min="0" step="1">
      <button type="submit" class="btn-primary">Guardar</button>
      <button type="button" id="category-cancel" class="btn-ghost" hidden>Cancelar edición</button>
      <p id="category-msg" class="msg"></p>
    </form>
    <div class="data-table-wrap">
      <table class="data-table" id="categories-table">
        <thead><tr><th>Nombre</th><th>Orden</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="tab-reservations" class="tab-panel" hidden>
    <div class="data-table-wrap">
      <table class="data-table" id="reservations-table">
        <thead><tr><th>Código</th><th>Nombre</th><th>Fecha</th><th>Hora</th><th>Personas</th><th>Estado</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section id="tab-settings" class="tab-panel" hidden>
    <form id="settings-form" class="settings-form">
      <label>Título principal (portada)
        <input type="text" name="hero_title" placeholder="Cocina de fuego lento, en el corazón del valle.">
      </label>
      <label>Texto debajo del título
        <textarea name="hero_text" rows="2" placeholder="Carnes a la parrilla, ingredientes locales..."></textarea>
      </label>
      <label>Número de WhatsApp (solo números, con código de país, sin + ni espacios)
        <input type="text" name="whatsapp" placeholder="573001234567" pattern="[0-9]{10,15}">
      </label>
      <button type="submit" class="btn-primary">Guardar cambios</button>
      <p id="settings-msg" class="msg"></p>
    </form>
  </section>

  <section id="tab-sales" class="tab-panel" hidden>
    <div class="sales-head">
      <button id="export-excel" type="button" class="btn-primary">Descargar Excel (ventas y gastos) ⬇</button>
    </div>

    <nav class="subtabs2">
      <button class="subtab2" data-subtab2="orders" aria-pressed="true">Pedidos web</button>
      <button class="subtab2" data-subtab2="cash" aria-pressed="false">Caja (venta rápida)</button>
      <button class="subtab2" data-subtab2="expenses" aria-pressed="false">Gastos</button>
    </nav>

    <div id="salessub-orders" class="subtab2-panel">
      <div class="data-table-wrap">
        <table class="data-table" id="orders-table">
          <thead><tr><th>Fecha</th><th>Cliente</th><th>Detalle</th><th>Total</th><th>Pago</th><th>Estado</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div id="salessub-cash" class="subtab2-panel" hidden>
      <form id="cash-sale-form" class="inline-form">
        <input type="number" name="amount" placeholder="Monto COP" min="1" step="1" required>
        <input type="text" name="note" placeholder="Nota (opcional, ej. Mesa 4)" maxlength="200">
        <button type="submit" class="btn-primary">Registrar venta</button>
      </form>
      <p id="cash-sale-msg" class="msg"></p>
      <div class="data-table-wrap">
        <table class="data-table" id="cash-sales-table">
          <thead><tr><th>Fecha</th><th>Nota</th><th>Monto</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div id="salessub-expenses" class="subtab2-panel" hidden>
      <form id="expense-form" class="inline-form">
        <input type="text" name="description" placeholder="Descripción del gasto" maxlength="200" required>
        <input type="number" name="amount" placeholder="Monto COP" min="1" step="1" required>
        <button type="submit" class="btn-primary">Registrar gasto</button>
      </form>
      <p id="expense-msg" class="msg"></p>
      <div class="data-table-wrap">
        <table class="data-table" id="expenses-table">
          <thead><tr><th>Fecha</th><th>Descripción</th><th>Monto</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="Scripts/config.js"></script>
<script src="Scripts/site.js"></script>
<script src="Scripts/admin.js"></script>
</body>
</html>
